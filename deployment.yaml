apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  labels:
    app: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-app
        image: 883017227984.dkr.ecr.us-east-1.amazonaws.com/feedback-image:latest
        ports:
        - containerPort: 5000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1"
        env:
        - name: DAGS_TOKEN
          valueFrom:
            secretKeyRef:
              name: capstone-secret
              key: DAGS_TOKEN

        - name: AWS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: capstone-secret
              key: AWS_ACCESS_KEY
        
        - name: AWS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: capstone-secret
              key: AWS_SECRET_KEY

        - name: URI
          valueFrom:
            secretKeyRef:
              name: capstone-secret
              key: URI

        - name: OWNER
          valueFrom:
            secretKeyRef:
              name: capstone-secret
              key: OWNER
   

---
apiVersion: v1
kind: Service
metadata:
  name: flask-app-service
spec:
  type: LoadBalancer
  selector:
    app: flask-app
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: 5000